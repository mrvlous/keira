# System Call Interface & Dispatch Crate (keira-syscall)
#
# Implements 111 active POSIX system call vectors spanning IDs 1..=114,
# x86_64 SYSCALL and i686 INT 0x80 calling conventions, TSS setup and user copies.

[package]
name = "keira-syscall"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "System call vector dispatchers, safe user copying and exception handlers for Keira Kernel"

[dependencies]
keira-core = { path = "../core" }
keira-arch = { path = "../arch" }
keira-crypto = { path = "../crypto" }
keira-mem = { path = "../mem" }
keira-io = { path = "../io" }
keira-fs = { path = "../fs" }
keira-net = { path = "../net" }
keira-task = { path = "../task" }
keira-ipc = { path = "../ipc" }
