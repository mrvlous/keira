# SPDX-License-Identifier: GPL-2.0-only

# System Call Interface & Dispatch Crate (keira-syscall)
#
# Implements 89 POSIX system call dispatch vectors, x86_64 SYSCALL and
# i686 INT 0x80 calling conventions, TSS configuration and safe user copying.

[package]
name = "keira-syscall"
version = "0.8.0"
edition = "2021"
authors = ["Moh. Ananda Firmansyah Putra"]
license = "GPL-2.0-only"
description = "System call vector dispatchers, safe user copying and exception handlers for Keira Kernel"

[dependencies]
keira-core = { path = "../core" }
keira-arch = { path = "../arch" }
keira-crypto = { path = "../crypto" }
keira-mem = { path = "../mem" }
keira-io = { path = "../io" }
keira-fs = { path = "../fs" }
keira-net = { path = "../net" }
keira-task = { path = "../task" }
keira-ipc = { path = "../ipc" }
