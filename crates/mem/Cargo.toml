# Memory Management Subsystem Crate (keira-mem)
#
# Implements PMM bitmap frame tracking, 4-level paging VMM, segregated
# slab heap allocators, contiguous DMA buffers and swap paging.

[package]
name = "keira-mem"
version = "0.8.0"
edition = "2021"
authors = ["Moh. Ananda Firmansyah Putra"]
license = "GPL-2.0-only"
description = "Physical memory allocator, 4-level virtual paging, DMA and swap pager for Keira Kernel"

[dependencies]
keira-core = { path = "../core" }
keira-arch = { path = "../arch" }
