# Virtual File System & Storage Crate (keira-fs)
#
# Implements POSIX VFS, Inode/Dentry abstractions, FAT12/16/32, EXT4,
# USTAR initrd, page cache buffer heads and ELF executable loading.

[package]
name = "keira-fs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Virtual Filesystem (VFS), FAT12/16/32, EXT4, TAR initrd, LVM/RAID and ELF loader for Keira Kernel"

[dependencies]
keira-core = { path = "../core" }
keira-arch = { path = "../arch" }
keira-mem = { path = "../mem" }
keira-io = { path = "../io" }
