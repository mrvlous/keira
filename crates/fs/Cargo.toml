# SPDX-License-Identifier: GPL-2.0-only

# Virtual File System & Storage Crate (keira-fs)
#
# Implements POSIX VFS, Inode/Dentry abstractions, FAT12/16/32, EXT4,
# USTAR initrd, page cache buffer heads and ELF executable loading.

[package]
name = "keira-fs"
version = "0.8.0"
edition = "2021"
authors = ["Moh. Ananda Firmansyah Putra"]
license = "GPL-2.0-only"
description = "Virtual Filesystem (VFS), FAT12/16/32, EXT4, TAR initrd, LVM/RAID and ELF64 loader for Keira Kernel"

[dependencies]
keira-core = { path = "../core" }
keira-arch = { path = "../arch" }
keira-mem = { path = "../mem" }
keira-io = { path = "../io" }
