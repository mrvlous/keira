# Master Kernel Assembly Crate (keira-kernel)
#
# Serves as the top-level orchestration crate, managing the 10-stage boot
# pipeline, supervisor diagnostics and entry points for Keira Kernel.

[package]
name = "keira-kernel"
version = "0.8.0"
edition = "2021"
authors = ["Moh. Ananda Firmansyah Putra"]
license = "GPL-2.0-only"
description = "Master kernel assembly crate compiling into static library for Keira Kernel"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
keira-core = { path = "../core" }
keira-arch = { path = "../arch" }
keira-crypto = { path = "../crypto" }
keira-mem = { path = "../mem" }
keira-io = { path = "../io" }
keira-fs = { path = "../fs" }
keira-net = { path = "../net" }
keira-task = { path = "../task" }
keira-ipc = { path = "../ipc" }
keira-syscall = { path = "../syscall" }
keira-shell = { path = "../shell" }
