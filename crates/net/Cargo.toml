# SPDX-License-Identifier: GPL-2.0-only

# Network Stack & Interface Drivers Crate (keira-net)
#
# Implements Intel e1000 and RTL8139 NICs, loopback adapter, Ethernet II,
# ARP resolution, IPv4 routing, TCP sliding-window, UDP and embedded TLS 1.3.

[package]
name = "keira-net"
version = "0.8.0"
edition = "2021"
authors = ["Moh. Ananda Firmansyah Putra"]
license = "GPL-2.0-only"
description = "Intel e1000 NIC driver, TCP/IP stack, DHCP, DNS, TLS 1.3, Netfilter and BPF for Keira Kernel"

[dependencies]
keira-core = { path = "../core" }
keira-arch = { path = "../arch" }
keira-mem = { path = "../mem" }
keira-io = { path = "../io" }
keira-crypto = { path = "../crypto" }
