# Supervisor Diagnostic Shell Crate (keira-shell)
#
# Implements Ring 0 emergency interactive shell, 15 diagnostic commands,
# CliArgs tokenizer, tab auto-completion and kvi modal text editor.

[package]
name = "keira-shell"
version = "0.8.0"
edition = "2021"
authors = ["Moh. Ananda Firmansyah Putra"]
license = "GPL-2.0-only"
description = "Interactive system shell, code editor, autocomplete and 78 native commands for Keira Kernel"

[dependencies]
keira-core = { path = "../core" }
keira-arch = { path = "../arch" }
keira-crypto = { path = "../crypto" }
keira-mem = { path = "../mem" }
keira-io = { path = "../io" }
keira-fs = { path = "../fs" }
keira-net = { path = "../net" }
keira-task = { path = "../task" }
keira-ipc = { path = "../ipc" }
keira-syscall = { path = "../syscall" }
