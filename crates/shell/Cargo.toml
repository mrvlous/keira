# Supervisor Diagnostic Shell Crate (keira-shell)
#
# Implements Ring 0 interactive diagnostic shell, 41 commands (61 with aliases),
# CliArgs tokenizer, tab auto-completion and terminal UI primitives.

[package]
name = "keira-shell"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Supervisor diagnostic shell, autocomplete and 41 diagnostic commands for Keira Kernel"

[dependencies]
keira-core = { path = "../core" }
keira-arch = { path = "../arch" }
keira-crypto = { path = "../crypto" }
keira-mem = { path = "../mem" }
keira-io = { path = "../io" }
keira-fs = { path = "../fs" }
keira-net = { path = "../net" }
keira-task = { path = "../task" }
keira-ipc = { path = "../ipc" }
keira-syscall = { path = "../syscall" }
