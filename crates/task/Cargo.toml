# SPDX-License-Identifier: GPL-2.0-only

# Task Management & Preemptive Scheduler Crate (keira-task)
#
# Implements Chase-Lev work-stealing SMP scheduler, Process Control Blocks,
# AP trampoline bringup, IPI interrupts, POSIX signals and cgroups.

[package]
name = "keira-task"
version = "0.8.0"
edition = "2021"
authors = ["Moh. Ananda Firmansyah Putra"]
license = "GPL-2.0-only"
description = "Preemptive multitasking scheduler, cgroups, MAC policies and signals for Keira Kernel"

[dependencies]
keira-core = { path = "../core" }
keira-arch = { path = "../arch" }
keira-mem = { path = "../mem" }
keira-io = { path = "../io" }
keira-fs = { path = "../fs" }
