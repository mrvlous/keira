# Hardware Architecture Subsystem Crate (keira-arch)
#
# Implements low-level CPU control, MSR registers, GDT/TSS, IDT interrupts,
# Local APIC, I/O APIC, HPET and PIT timers for Keira Kernel.

[package]
name = "keira-arch"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CPU instructions, MSRs, timers, APIC and virtualization for Keira Kernel"

[dependencies]
keira-core = { path = "../core" }
