# SPDX-License-Identifier: GPL-2.0-only

# Hardware Architecture Subsystem Crate (keira-arch)
#
# Implements low-level CPU control, MSR registers, GDT/TSS, IDT interrupts,
# Local APIC, I/O APIC, HPET and PIT timers for Keira Kernel.

[package]
name = "keira-arch"
version = "0.8.0"
edition = "2021"
authors = ["Moh. Ananda Firmansyah Putra"]
license = "GPL-2.0-only"
description = "x86_64 CPU instructions, MSRs, timers, APIC and virtualization for Keira Kernel"

[dependencies]
keira-core = { path = "../core" }
