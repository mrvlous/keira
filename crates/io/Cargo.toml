# SPDX-License-Identifier: GPL-2.0-only

# Hardware I/O & Bus Controllers Crate (keira-io)
#
# Implements serial COM1 UART, VGA framebuffer, PCI/PCIe enumeration,
# IDE/ATA, AHCI SATA, NVMe and USB host controller drivers.

[package]
name = "keira-io"
version = "0.8.0"
edition = "2021"
authors = ["Moh. Ananda Firmansyah Putra"]
license = "GPL-2.0-only"
description = "Display, Serial UART, PCI/PCIe, NVMe, AHCI, USB and Audio drivers for Keira Kernel"

[dependencies]
keira-core = { path = "../core" }
keira-arch = { path = "../arch" }
keira-mem = { path = "../mem" }
