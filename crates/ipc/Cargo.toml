# SPDX-License-Identifier: GPL-2.0-only

# Inter-Process Communication Crate (keira-ipc)
#
# Implements anonymous pipes, splice zero-copy, POSIX shared memory,
# futex wait/wake queues, eventfd, epoll and Linux-compatible io_uring.

[package]
name = "keira-ipc"
version = "0.8.0"
edition = "2021"
authors = ["Moh. Ananda Firmansyah Putra"]
license = "GPL-2.0-only"
description = "Pipes, Futex, Epoll, EventFD, MQueue, Splice, POSIX SHM and io_uring for Keira Kernel"

[dependencies]
keira-core = { path = "../core" }
keira-arch = { path = "../arch" }
keira-mem = { path = "../mem" }
keira-io = { path = "../io" }
keira-fs = { path = "../fs" }
keira-net = { path = "../net" }
keira-task = { path = "../task" }
