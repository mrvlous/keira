# Clippy Linter Configuration
#
# Adjusts limits and style rules for cargo clippy code diagnostics.
# See https://doc.rust-lang.org/clippy/index.html for details.

# Maximum number of parameters a function can have before warning
too-many-arguments-threshold = 8

# Maximum line length warning threshold (aligned with rustfmt.toml)
max-line-length = 100
