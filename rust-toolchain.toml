# Rust Toolchain Pinning Configuration
#
# Specifies the exact Rust toolchain and compiler components required to compile
# the Keira Kernel project.

[toolchain]
# Enforce the nightly release channel (required for unstable/experimental core library features)
channel = "nightly"

# Install target components:
#   - rust-src: Required to rebuild the core library on-the-fly for custom targets
components = ["rust-src"]
